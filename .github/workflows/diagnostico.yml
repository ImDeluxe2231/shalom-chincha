name: Diagnóstico Django

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnostico.yml'
      - 'accounts/**'
      - 'customers/**'
      - 'shipments/**'
      - 'operations/**'
      - 'reports/**'
      - 'research/**'
      - 'shalom_web/**'
      - 'templates/**'
      - 'requirements.txt'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: clave-temporal-exclusiva-para-pruebas-ci
      DEBUG: 'True'
      PRODUCTION: 'False'
      DB_ENGINE: sqlite
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Comprobar configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas con diagnóstico
        id: tests
        shell: bash
        run: |
          set +e
          python manage.py test --noinput --verbosity 2 > /tmp/shalom-tests.log 2>&1
          result=$?
          cat /tmp/shalom-tests.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Publicar diagnóstico en el pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('/tmp/shalom-tests.log').read_text(errors='replace') if Path('/tmp/shalom-tests.log').exists() else 'No se generó el registro de pruebas.'
          # El proyecto usa únicamente datos de prueba. No se publican variables de entorno.
          markers = ('ERROR:', 'FAIL:', 'Traceback', 'AssertionError:', 'FAILED (', 'Ran ', 'ImportError:', 'ModuleNotFoundError:')
          lines = text.splitlines()
          selected = [line for line in lines if any(marker in line for marker in markers)]
          if not selected:
              selected = lines[-100:]
          report = '\n'.join(selected)[-12000:]
          body = '### Diagnóstico automático de Django\n\nEjecución: ' + os.environ['RUN_URL'] + '\n\n```text\n' + report.replace('```', "'''") + '\n```\n\nEl check conserva su resultado real; no se desactivaron pruebas.'
          Path('/tmp/shalom-diagnostic.md').write_text(body)
          PY
          gh pr comment "$PR_NUMBER" --body-file /tmp/shalom-diagnostic.md
